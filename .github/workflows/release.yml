name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check CMakeLists.txt PROJECT_VERSION matches tag
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          BASE_VERSION=${VERSION%-rc*}
          CMAKE_VERSION=$(grep -Po 'project\(elfeed2 VERSION \K[^ ]+' CMakeLists.txt)
          if [[ "$BASE_VERSION" != "$CMAKE_VERSION" ]]; then
            echo "::error::tag v$VERSION does not match CMakeLists.txt PROJECT_VERSION ($CMAKE_VERSION)"
            exit 1
          fi

  build-macos:
    needs: verify-version
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      # Cache the FetchContent output (wxWidgets, mbedTLS, sqlite,
      # pugixml, cpp-httplib) so the slow first-build cost amortizes
      # across runs. ImageVersion is GitHub's per-runner-image
      # identifier — bumps when the macos-14 image is refreshed
      # (toolchain version moves with it).
      - name: Cache _deps
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-macos-${{ runner.os }}-${{ env.ImageVersion }}-${{ hashFiles('cmake/Fetch*.cmake') }}
          restore-keys: |
            deps-macos-${{ runner.os }}-${{ env.ImageVersion }}-

      - name: Configure
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build
        # -j 2 keeps memory pressure manageable on the 14 GB mac-14
        # runner; cached _deps means second-run cost is small even
        # at low parallelism. See build-windows for the swap-
        # thrashing failure mode this avoids.
        run: cmake --build build --config Release -j 2

      # Unsigned beyond the linker's ad-hoc signature: sign-macos signs
      # it, so that the certificate never shares a job with the build.
      # tar keeps the bundle's symlinks and modes through the artifact.
      - name: Upload app
        run: tar czf elfeed2.app.tar.gz -C build elfeed2.app

      - uses: actions/upload-artifact@v4
        with:
          name: elfeed2-macos-app
          path: elfeed2.app.tar.gz
          if-no-files-found: error

  # Signs the app with the Developer ID Application certificate, a .p12
  # in base64 (MACOS_CERTIFICATE, with MACOS_CERTIFICATE_PASSWORD) put
  # into a keychain made for the job, packs the disk image, and
  # notarizes it with an App Store Connect API key (MACOS_NOTARY_KEY,
  # the .p8's text, with MACOS_NOTARY_KEY_ID and MACOS_NOTARY_ISSUER)
  # through cmake/notarize.cmake, which signs and staples the image.
  sign-macos:
    needs: build-macos
    runs-on: macos-14
    environment: release
    env:
      IDENTITY: 'Developer ID Application: Christopher Wellons (A7AR282GVM)'
    steps:
      - uses: actions/checkout@v4   # for cmake/notarize.cmake

      - uses: actions/download-artifact@v4
        with:
          name: elfeed2-macos-app
          path: app

      # A keychain of the job's own, with a random password, which
      # codesign may use without asking, searched ahead of the others
      - name: Import the certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          kc=$RUNNER_TEMP/signing.keychain-db
          pw=$(openssl rand -hex 24)
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          printf %s "$MACOS_CERTIFICATE" | base64 -d >"$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" \
              -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
              -s -k "$pw" "$kc" >/dev/null
          # shellcheck disable=SC2046  # the list, one keychain per word
          security list-keychains -d user -s "$kc" \
              $(security list-keychains -d user | tr -d '"')
          if ! security find-identity -v -p codesigning "$kc" | grep -qF "\"$IDENTITY\""; then
              echo "::error::no identity \"$IDENTITY\" in the certificate"
              exit 1
          fi

      # As ELFEED2_SIGN_IDENTITY signs in CMakeLists.txt: the hardened
      # runtime and a secure timestamp. APFS for the image, per the
      # CPACK_DMG_FILESYSTEM note there.
      - name: Sign the app and make the disk image
        run: |
          v=$(grep -Eo 'project\(elfeed2 VERSION [^ ]+' CMakeLists.txt | cut -d' ' -f3)
          mkdir "$RUNNER_TEMP/dmg"
          tar xzf app/elfeed2.app.tar.gz -C "$RUNNER_TEMP/dmg"
          a=$RUNNER_TEMP/dmg/elfeed2.app
          codesign --force --options runtime --timestamp --sign "$IDENTITY" "$a"
          codesign --verify --deep --strict --verbose=2 "$a"
          ln -s /Applications "$RUNNER_TEMP/dmg/Applications"
          mkdir out
          hdiutil create -volname Elfeed2 -srcfolder "$RUNNER_TEMP/dmg" \
              -fs APFS -format UDZO "out/elfeed2-$v-macos-arm64.dmg"
          echo "DMG=out/elfeed2-$v-macos-arm64.dmg" >>"$GITHUB_ENV"

      - name: Notarize
        env:
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          ELFEED2_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          ELFEED2_NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
        run: |
          export ELFEED2_NOTARY_KEY=$RUNNER_TEMP/notary.p8
          printf '%s\n' "$MACOS_NOTARY_KEY" >"$ELFEED2_NOTARY_KEY"
          cmake -DCPACK_PACKAGE_FILES="$PWD/$DMG" \
                -DCPACK_ELFEED2_SIGN_IDENTITY="$IDENTITY" \
                -P cmake/notarize.cmake

      - name: Remove the keychain and key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/cert.p12"

      - uses: actions/upload-artifact@v4
        with:
          name: elfeed2-macos
          path: out/elfeed2-*-macos-arm64.dmg
          if-no-files-found: error

  build-windows:
    needs: verify-version
    # Cross-compile from Linux with mingw-w64 — no Windows runner
    # needed. Resulting .exe statically links libstdc++ / libgcc /
    # winpthread (see cmake/Toolchain-Mingw64.cmake), so the
    # binary depends only on system Win32 DLLs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mingw-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64

      # Toolchain file is part of the cache key — changing the
      # mingw flags would otherwise silently reuse incompatible
      # objects. ImageVersion bumps when the ubuntu image rolls
      # (apt-installed mingw moves with it).
      - name: Cache _deps
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-mingw-${{ runner.os }}-${{ env.ImageVersion }}-${{ hashFiles('cmake/Fetch*.cmake', 'cmake/Toolchain-Mingw64.cmake') }}
          restore-keys: |
            deps-mingw-${{ runner.os }}-${{ env.ImageVersion }}-

      - name: Configure
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=cmake/Toolchain-Mingw64.cmake

      - name: Build
        # -j 2 instead of -j (= 4) on the 7 GB ubuntu-latest runner.
        # Default parallelism causes wxWidgets compiles to thrash
        # swap and stall the build past the runner's stuck-detection
        # window, which reads as a phantom cancellation at 88%.
        run: cmake --build build -j 2

      - name: Upload unsigned exe
        uses: actions/upload-artifact@v4
        with:
          name: elfeed2-windows-exe
          path: build/elfeed2.exe
          if-no-files-found: error

  release:
    needs: [sign-macos, build-windows]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write   # gh release create
      id-token: write   # aas-sign OIDC handshake
    steps:
      - uses: actions/checkout@v4   # for README.md

      - name: Download macOS DMG
        uses: actions/download-artifact@v4
        with:
          name: elfeed2-macos
          path: dist

      - name: Download Windows exe
        uses: actions/download-artifact@v4
        with:
          name: elfeed2-windows-exe
          path: dist-windows

      - name: Sign elfeed2.exe
        uses: skeeto/aas-sign@v1.0.0
        with:
          endpoint:  ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          account:   ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          profile:   ${{ secrets.CERTIFICATE_PROFILE }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          files: dist-windows/elfeed2.exe

      - name: Assemble Windows ZIP, rename for -rc tags
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          BASE_VERSION=${VERSION%-rc*}

          # Zip the signed exe + README.md at archive root.
          STAGE=$(mktemp -d)
          cp dist-windows/elfeed2.exe "$STAGE/"
          cp README.md "$STAGE/"
          (cd "$STAGE" && zip -r "$GITHUB_WORKSPACE/dist/elfeed2-${BASE_VERSION}-windows-x64.zip" elfeed2.exe README.md)

          # For -rc tags, rename both artifacts so user-facing
          # download filenames carry the full tag version. CPack only
          # knows PROJECT_VERSION (the base).
          if [[ "$VERSION" != "$BASE_VERSION" ]]; then
            mv "dist/elfeed2-${BASE_VERSION}-macos-arm64.dmg" \
               "dist/elfeed2-${VERSION}-macos-arm64.dmg"
            mv "dist/elfeed2-${BASE_VERSION}-windows-x64.zip" \
               "dist/elfeed2-${VERSION}-windows-x64.zip"
          fi
          ls -l dist/

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          # Tags like vX.Y.Z-rcN are pipeline-test runs: publish as a
          # draft prerelease so they don't trigger release immutability
          # and can be deleted/retried freely.
          FLAGS=()
          if [[ "$VERSION" == *-rc* ]]; then
            FLAGS+=(--draft --prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$VERSION" \
            "${FLAGS[@]}" \
            "dist/elfeed2-${VERSION}-macos-arm64.dmg" \
            "dist/elfeed2-${VERSION}-windows-x64.zip"
